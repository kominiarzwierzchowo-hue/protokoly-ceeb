<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generator CEEB - Mobilny</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 10px; color: #333; margin: 0; }
        .container { max-width: 100%; margin: 0 auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #0d3880; font-size: 18px; border-bottom: 2px solid #0d3880; padding-bottom: 6px; text-align: center; }
        h2 { color: #0d3880; font-size: 14px; margin-top: 20px; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
        .group { background: #f7f8fa; border: 1px solid #ddd; padding: 10px; margin-bottom: 8px; border-radius: 5px; }
        label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 4px; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; background: #fff; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .grid-5 input { padding: 6px; text-align: center; font-size: 12px; }
        .grid-5 label { font-size: 10px; text-align: center; }
        button { background: #0d3880; color: white; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 15px; }
        button:active { background: #082454; }
        .output-box { margin-top: 10px; background: #eef3fc; border: 1px solid #b2c8f0; padding: 12px; border-radius: 5px; }
        .output-text { white-space: pre-wrap; font-size: 12px; line-height: 1.4; word-break: break-word; }
        .btn-copy { background: #28a745; margin-top: 8px; padding: 10px; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Generator CEEB</h1>

    <h2>Sekcja A: Inne Uwagi</h2>
    <div class="group">
        <label>Data i godzina kontroli:</label>
        <input type="text" id="data_czas" placeholder="np. 21.09.2026 r., godz. 10:00">
    </div>
    <div class="group">
        <label>Ilość przewodów kominowych:</label>
        <div class="grid-5">
            <div><label>Dym</label><input type="text" id="p_dym" value="0"></div>
            <div><label>Spal</label><input type="text" id="p_spa" value="0"></div>
            <div><label>Went</label><input type="text" id="p_wen" value="0"></div>
            <div><label>Awar</label><input type="text" id="p_awa" value="0"></div>
            <div><label>Razem</label><input type="text" id="p_raz" value="0"></div>
        </div>
    </div>
    <div class="group grid-2">
        <div>
            <label>Dostęp do kontroli:</label>
            <select id="dostep">
                <option value="jest">jest</option>
                <option value="brak stopni">brak stopni</option>
                <option value="brak ław">brak ław</option>
                <option value="brak drabiny">brak drabiny</option>
            </select>
        </div>
        <div>
            <label>Nieudostępnione lokale:</label>
            <input type="text" id="lokale_brak" placeholder="np. 4, 8 (lub brak)">
        </div>
    </div>
    <div class="group">
        <label>Stan kominów ponad dachem:</label>
        <select id="s_dach_sel" onchange="document.getElementById('s_dach_opis').value=this.value;">
            <option value="dobry">dobry</option>
            <option value="zły">zły</option>
            <option value="uszkodzone tynki">uszkodzone tynki</option>
            <option value="przebudowa">przebudowa</option>
            <option value="naprawa">naprawa</option>
            <option value="wadliwe">wadliwe</option>
        </select>
        <input type="text" id="s_dach_opis" value="dobry" style="margin-top: 5px;">
    </div>
    <div class="group">
        <label>Stan kominów na strychu:</label>
        <select id="s_strych_sel" onchange="document.getElementById('s_strych_opis').value=this.value;">
            <option value="dobry">dobry</option>
            <option value="zły">zły</option>
            <option value="uszkodzone tynki">uszkodzone tynki</option>
            <option value="przebudowa">przebudowa</option>
            <option value="naprawa">naprawa</option>
            <option value="wadliwe">wadliwe</option>
        </select>
        <input type="text" id="s_strych_opis" value="dobry" style="margin-top: 5px;">
    </div>
    <div class="group grid-2">
        <div>
            <label>Stan drzwiczek:</label>
            <select id="drzwiczki_stan">
                <option value="dobry">dobry</option>
                <option value="zły">zły</option>
                <option value="brak">brak</option>
            </select>
        </div>
        <div>
            <label>Gdzie:</label>
            <input type="text" id="drzwiczki_gdzie" placeholder="np. w piwnicy">
        </div>
    </div>
    <div class="group">
        <label>Nasady kominowe:</label>
        <input type="text" id="nasady" placeholder="np. uszkodzone, 1 sztuka">
    </div>

    <h2>Sekcja B: Nieprawidłowości (1-14)</h2>
    <div class="group"><label>1. Wymiana przewodu łączącego (gaz) - Mieszkania nr:</label><input type="text" id="u1"></div>
    <div class="group"><label>2. Nieszczelne podłączenie rury spaliny - Mieszkania nr:</label><input type="text" id="u2"></div>
    <div class="group"><label>3. Demontaż siatek / żaluzji z kratek - Mieszkania nr:</label><input type="text" id="u3"></div>
    <div class="group"><label>4. Wymiana kratek na nowe 14x21 cm - Lokale nr:</label><input type="text" id="u4"></div>
    <div class="group"><label>5. Za mała powierzchnia dopływu powietrza w drzwiach - Mieszkania:</label><input type="text" id="u5"></div>
    <div class="group"><label>6. Niedozwolony wyciąg mechaniczny - Mieszkania:</label><input type="text" id="u6"></div>
    <div class="group"><label>7. Brak drożności / zasłonięcie kratki - Lokale:</label><input type="text" id="u7"></div>
    <div class="group"><label>8. Zabudowana rura łącząca piec/kocioł - Mieszkania:</label><input type="text" id="u8"></div>
    <div class="group"><label>9. Nieprawidłowa instalacja z rur PCV - Lokale:</label><input type="text" id="u9"></div>
    <div class="group"><label>10. Wentylacja jako otwór w ścianie zewnętrznej - Lokale:</label><input type="text" id="u10"></div>
    <div class="group"><label>11. Całkowity brak wentylacji - Lokale:</label><input type="text" id="u11"></div>
    <div class="group"><label>12. Niedozwolona zabudowa meblowa gazu - Mieszkania:</label><input type="text" id="u12"></div>
    <div class="group"><label>13. Palny osad smolny w przewodzie dymowym - Mieszkania:</label><input type="text" id="u13"></div>
    <div class="group"><label>14. Brak/niewystarczająca ilość powietrza nawiewnego - Mieszkania:</label><input type="text" id="u14"></div>

    <button onclick="generujWszystko()">GENERUJ DOKUMENT</button>

    <div id="wynik_sekcja" style="display:none;">
        <h3>1. Inne uwagi:</h3>
        <div class="output-box">
            <div id="out_uwagi" class="output-text"></div>
            <button class="btn-copy" onclick="kopiujTekst('out_uwagi')">Kopiuj "Inne uwagi"</button>
        </div>

        <h3>2. Stwierdzone nieprawidłowości:</h3>
        <div class="output-box">
            <div id="out_nieprawidlowosci" class="output-text"></div>
            <button class="btn-copy" onclick="kopiujTekst('out_nieprawidlowosci')">Kopiuj "Nieprawidłowości"</button>
        </div>
    </div>
</div>

<script>
    function generujWszystko() {
        let dc = document.getElementById('data_czas').value;
        let pd = document.getElementById('p_dym').value;
        let ps = document.getElementById('p_spa').value;
        let pw = document.getElementById('p_wen').value;
        let pa = document.getElementById('p_awa').value;
        let pr = document.getElementById('p_raz').value;
        let dos = document.getElementById('dostep').value;
        let lb = document.getElementById('lokale_brak').value;
        let sd = document.getElementById('s_dach_opis').value;
        let ss = document.getElementById('s_strych_opis').value;
        let dzs = document.getElementById('drzwiczki_stan').value;
        let dzg = document.getElementById('drzwiczki_gdzie').value;
        let nas = document.getElementById('nasady').value;

        let txtUwagi = `Data i godzina kontroli: ${dc}. Ilość przewodów - dymowe: ${pd}, spalinowe: ${ps}, wentylacyjne: ${pw}, awaryjne: ${pa}, razem: ${pr}. Dostęp do kontroli: ${dos}. ` +
                       (lb ? `Nieudostępnione lokale do kontroli nr: ${lb}. ` : '') +
                       `Stan kominów ponad dachem: ${sd}. Stan kominów na strychu: ${ss}. Stan drzwiczek kominowych: ${dzs}${dzg ? ' (' + dzg + ')' : ''}. ` +
                       (nas ? `Nasady kominowe: ${nas}.` : '');
        document.getElementById('out_uwagi').innerText = txtUwagi;

        let items = [];
        let v1 = document.getElementById('u1').value.trim();
        if(v1) items.push("Stwierdzono zastosowanie nieodpowiedniego przewodu łączącego urządzenie gazowe z przewodem kominowym. Nakazane wykonanie: Wymienić przewód łączący urządzenie gazowe z przewodem kominowym na nowy, wykonany ze stali kwasoodpornej posiadający deklarację właściwości użytkowych (certyfikat CE). Mieszkania nr: " + v1 + ".");

        let v2 = document.getElementById('u2').value.trim();
        if(v2) items.push("Stwierdzono nieszczelne podłączenie rury odprowadzającej spaliny. Nakazane wykonanie: Bezzwłocznie i trwale uszczelnić połączenia rury spalinowej podgrzewacza/kotła z wlotem do komina. Dotyczy mieszkań nr: " + v2 + ".");

        let v3 = document.getElementById('u3').value.trim();
        if(v3) items.push("Stwierdzono zamontowanie na kratkach wentylacyjnych osłon (siatek/żaluzji), które powodują przewężenie strumienia powietrza lub blokadę wentylacji. Nakazane wykonanie: Usunąć siatki oraz żaluzje z kratek wentylacyjnych. Mieszkania nr: " + v3 + ".");

        let v4 = document.getElementById('u4').value.trim();
        if(v4) items.push("Stwierdzono zamontowanie kratek wentylacyjnych o zbyt małych wymiarach. Nakazane wykonanie: Wymienić kratki na nowe o wymiarach 14x21 cm bez żaluzji i siatek. Lokale nr: " + v4 + ".");

        let v5 = document.getElementById('u5').value.trim();
        if(v5) items.push("Stwierdzono niedostateczną powierzchnię dopływu powietrza w drzwiach wewnętrznych (min. 220 cm²). Mieszkania nr: " + v5 + ".");

        let v6 = document.getElementById('u6').value.trim();
        if(v6) items.push("Stwierdzono niedozwolone podłączenie mechanicznego wyciągu do wentylacji grawitacyjnej. Nakazane wykonanie: Zdemontować podłączenie wyciągu. Mieszkania nr: " + v6 + ".");

        let v7 = document.getElementById('u7').value.trim();
        if(v7) items.push("Stwierdzono brak drożności / zasłonięcie kratki wentylacyjnej. Nakazane wykonanie: Oczyścić kratkę. Lokale nr: " + v7 + ".");

        let v8 = document.getElementById('u8').value.trim();
        if(v8) items.push("Stwierdzono zabudowaną rurę łączącą piec/kocioł z kominem. Nakazane wykonanie: Zdemontować zabudowę / wykonać rewizję. Mieszkania nr: " + v8 + ".");

        let v9 = document.getElementById('u9').value.trim();
        if(v9) items.push("Stwierdzono nieprawidłową instalację z rur PCV. Nakazane wykonanie: Zastąpić rurami stalowymi ponad dach. Lokale: " + v9 + ".");

        let v10 = document.getElementById('u10').value.trim();
        if(v10) items.push("Stwierdzono wentylację jako otwór w ścianie zewnętrznej. Nakazane wykonanie: Wykonać pionowy przewód ponad dach. Lokale: " + v10 + ".");

        let v11 = document.getElementById('u11').value.trim();
        if(v11) items.push("Stwierdzono całkowity brak wentylacji w pomieszczeniu. Nakaz dotyczy lokali: " + v11 + ".");

        let v12 = document.getElementById('u12').value.trim();
        if(v12) items.push("Stwierdzono niedozwoloną stałą zabudowę meblową urządzenia gazowego. Mieszkania nr: " + v12 + ".");

        let v13 = document.getElementById('u13').value.trim();
        if(v13) items.push("Stwierdzono obecność palnego osadu smolnego w przewodzie dymowym. Wstrzymać eksploatację i wyczyścić komin. Mieszkania nr: " + v13 + ".");

        let v14 = document.getElementById('u14').value.trim();
        if(v14) items.push("Stwierdzono brak lub niewystarczającą ilość powietrza nawiewnego. Mieszkania nr: " + v14 + ".");

        if(items.length > 0) {
            items.push("Administrator (zarządca)/właściciel obiektu budowlanego przyjął do wiadomości zakres stosowania art.70 Ustawy Prawo Budowlane o obowiązkowym usunięciu usterek.");
        } else {
            items.push("Nie stwierdzono nieprawidłowości.");
        }

        document.getElementById('out_nieprawidlowosci').innerText = items.join("\n\n");
        document.getElementById('wynik_sekcja').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function kopiujTekst(id) {
        let t = document.getElementById(id).innerText;
        navigator.clipboard.writeText(t).then(() => alert("Skopiowano do schowka!"));
    }
</script>
</body>
</html>
