<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generator CEEB - Kominiarz</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 10px; color: #333; margin: 0; }
        .container { max-width: 100%; margin: 0 auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #0d3880; font-size: 18px; border-bottom: 2px solid #0d3880; padding-bottom: 6px; text-align: center; }
        h2 { color: #0d3880; font-size: 14px; margin-top: 20px; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
        .group { background: #f7f8fa; border: 1px solid #ddd; padding: 10px; margin-bottom: 8px; border-radius: 5px; position: relative; }
        label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 4px; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; background: #fff; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .grid-3 input { text-align: center; }
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .grid-5 input { padding: 6px; text-align: center; font-size: 12px; background: #eef2f6; font-weight: bold; color: #0d3880; }
        .grid-5 input.manual { background: #fff; font-weight: normal; color: #333; }
        .grid-5 label { font-size: 10px; text-align: center; }
        button { background: #0d3880; color: white; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 15px; }
        button:active { background: #082454; }
        .output-box { margin-top: 10px; background: #eef3fc; border: 1px solid #b2c8f0; padding: 12px; border-radius: 5px; }
        .output-text { white-space: pre-wrap; font-size: 12px; line-height: 1.4; word-break: break-word; }
        .btn-copy { background: #28a745; margin-top: 8px; padding: 10px; font-size: 14px; }
        .btn-red { background: #dc3545; margin-top: 8px; }
        .btn-success { background: #28a745; margin-top: 8px; }
        .btn-warning { background: #6c757d; margin-top: 10px; }
        
        .edit-load-box { background: #e2e8f0; padding: 12px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #cbd5e1; }
        
        /* Zakładki na górze */
        .tabs-nav { display: flex; gap: 5px; margin-bottom: 15px; background: #e2e8f0; padding: 4px; border-radius: 6px; }
        .tab-btn { flex: 1; padding: 12px; background: #cbd5e1; border: none; font-weight: bold; font-size: 13px; border-radius: 4px; cursor: pointer; color: #334155; margin-top: 0; text-align: center; }
        .tab-btn.active { background: #0d3880; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        canvas { border: 2px dashed #0d3880; background: #fff; width: 100%; height: 150px; border-radius: 4px; touch-action: none; cursor: crosshair; }
        .lokal-card { background: #fff; border: 2px solid #0d3880; padding: 12px; margin-bottom: 12px; border-radius: 6px; position: relative; }
        .locked-canvas { background: #e2e8f0; border-color: #64748b; cursor: not-allowed; }
        
        .btn-usun-lokal-top { position: absolute; top: 10px; right: 10px; background: #dc3545; color: white; border: none; padding: 6px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 0; width: auto; }
        .btn-usun-lokal-top:hover { background: #b02a37; }

        /* Pływająca listwa skrótów nad polem */
        .skroty-popup {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            background: #1e293b;
            border: 2px solid #0d3880;
            padding: 6px;
            border-radius: 6px;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            gap: 4px;
            flex-wrap: wrap;
        }
        .skroty-popup button {
            background: #0d3880;
            color: white;
            border: none;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 0;
            flex: 1;
            min-width: 45px;
            text-align: center;
        }
        .skroty-popup button:hover { background: #1d4ed8; }

        .podpis-podsumowanie-item { border-bottom: 1px dashed #ccc; padding: 8px 0; margin-bottom: 8px; }
        .podpis-podsumowanie-item img { max-width: 200px; height: 60px; border: 1px solid #999; background: #fff; display: block; margin-top: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Generator CEEB - Kominiarz</h1>

    <div class="edit-load-box">
        <label style="font-size: 13px; margin-bottom: 6px; color: #0d3880; font-weight: bold;">📁 Edytuj zapisany protokół z historii:</label>
        <select id="lista_historii_select" onchange="wczytajWybranyZHistorii()" style="margin-bottom: 8px; background: #fff;">
            <option value="">-- Wybierz protokół z listy do edycji --</option>
        </select>
        <div style="display: flex; gap: 6px;">
            <input type="file" id="input_wczytaj_json" accept=".json" onchange="wczytajPlikJSON(event)" style="background: #fff; padding: 6px; font-size: 11px; flex: 1;">
            <button type="button" onclick="usunAktualnyZHistorii()" class="btn-red" style="margin-top: 0; padding: 6px 12px; font-size: 12px; width: auto;">Usuń ten z historii</button>
        </div>
    </div>

    <div class="tabs-nav">
        <button type="button" class="tab-btn active" onclick="zmienZakladke(0)">📝 1. Dane Budynku i Uwagi</button>
        <button type="button" class="tab-btn" onclick="zmienZakladke(1)">✍️ 2. Lokale i Podpisy</button>
    </div>

    <!-- ZAKŁADKA 0: DANE OGÓLNE BUDYNKU I NIEPRAWIDŁOWOŚCI -->
    <div id="tab_0" class="tab-content active">
        <h2>Informacje ogólne o budynku</h2>
        <div class="group">
            <label>Adres budynku:</label>
            <input type="text" id="adres_budynku" placeholder="np. Wierzchowo, ul. 3 Marca 29F" oninput="zapiszStan()">
        </div>
        <div class="group">
            <label>Data i godzina kontroli:</label>
            <input type="text" id="data_czas" placeholder="np. 21.09.2026 r., godz. 10:00" oninput="zapiszStan()">
        </div>
        <div class="group">
            <label>Ilość przewodów kominowych (Cały budynek - Sumy z lokali):</label>
            <div class="grid-5">
                <div><label>Dym</label><input type="text" id="p_dym" value="0" readonly></div>
                <div><label>Spal</label><input type="text" id="p_spa" value="0" readonly></div>
                <div><label>Went</label><input type="text" id="p_wen" value="0" readonly></div>
                <div><label>Awar</label><input type="text" id="p_awa" value="0" class="manual" oninput="zapiszStan()"></div>
                <div><label>Razem</label><input type="text" id="p_raz" value="0" class="manual" oninput="zapiszStan()"></div>
            </div>
        </div>
        
        <!-- DOSTĘP DO KONTROLI Z OPCJAMI -->
        <div class="group">
            <label>Dostęp do kontroli:</label>
            <select id="dostep_wybor" onchange="zmienDostepKontroli(); zapiszStan();">
                <option value="tak">Tak</option>
                <option value="nie">Nie</option>
            </select>
            
            <div id="dostep_opcje_nie" style="margin-top: 8px; display: none; background: #fff; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                <label style="font-size: 11px; margin-bottom: 6px; color: #0d3880;">Zaznacz braki (możesz wybrać kilka):</label>
                <label style="font-weight: normal; font-size: 12px; margin-bottom: 4px;"><input type="checkbox" id="chk_brak_wykazu" onchange="zapiszStan()"> Brak wykazu dachowego</label>
                <label style="font-weight: normal; font-size: 12px; margin-bottom: 4px;"><input type="checkbox" id="chk_brak_law" onchange="zapiszStan()"> Brak ław kominiarskich</label>
                <label style="font-weight: normal; font-size: 12px; margin-bottom: 4px;"><input type="checkbox" id="chk_brak_drabiny" onchange="zapiszStan()"> Brak drabiny</label>
                <label style="font-weight: normal; font-size: 12px; margin-bottom: 0;"><input type="checkbox" id="chk_brak_stopni" onchange="zapiszStan()"> Brak stopni kominiarskich</label>
            </div>
        </div>

        <div class="group">
            <label>Stan kominów ponad dachem:</label>
            <select id="s_dach_sel" onchange="document.getElementById('s_dach_opis').value=this.value; zapiszStan();">
                <option value="dobry">dobry</option>
                <option value="zły">zły</option>
                <option value="uszkodzone tynki">uszkodzone tynki</option>
                <option value="przebudowa">przebudowa</option>
                <option value="naprawa">naprawa</option>
                <option value="wadliwe">wadliwe</option>
            </select>
            <input type="text" id="s_dach_opis" value="dobry" style="margin-top: 5px;" oninput="zapiszStan()">
        </div>
        <div class="group">
            <label>Stan kominów na strychu:</label>
            <select id="s_strych_sel" onchange="document.getElementById('s_strych_opis').value=this.value; zapiszStan();">
                <option value="dobry">dobry</option>
                <option value="zły">zły</option>
                <option value="uszkodzone tynki">uszkodzone tynki</option>
                <option value="przebudowa">przebudowa</option>
                <option value="naprawa">naprawa</option>
                <option value="wadliwe">wadliwe</option>
            </select>
            <input type="text" id="s_strych_opis" value="dobry" style="margin-top: 5px;" oninput="zapiszStan()">
        </div>
        <div class="group grid-2">
            <div>
                <label>Stan drzwiczek:</label>
                <select id="drzwiczki_stan" onchange="zapiszStan()">
                    <option value="dobry">dobry</option>
                    <option value="zły">zły</option>
                    <option value="brak">brak</option>
                </select>
            </div>
            <div>
                <label>Gdzie:</label>
                <input type="text" id="drzwiczki_gdzie" placeholder="np. w piwnicy" oninput="zapiszStan()">
            </div>
        </div>
        <div class="group">
            <label>Nasady kominowe:</label>
            <input type="text" id="nasady" placeholder="np. uszkodzone, 1 sztuka" oninput="zapiszStan()">
        </div>

        <h2>Własne uwagi i spostrzeżenia z kontroli</h2>
        <div class="group">
            <label>Inne / dodatkowe uwagi (niestandardowe):</label>
            <textarea id="uwagi_własne" rows="3" placeholder="Wpisz uwagi..." oninput="zapiszStan()"></textarea>
        </div>

        <h2>Stwierdzone Nieprawidłowości (1-15)</h2>
        
        <!-- Rubryki 1, 2, 8, 12, 13 (Urządzenia) -->
        <div class="group"><label>1. Wymiana przewodu łączącego (gaz):</label><input type="text" id="u1" placeholder="np. 4 PGW / 12 KCOgaz" onclick="pokazPopup(1, 'urzadzenia')" oninput="zapiszStan()"><div id="popup_u1" class="skroty-popup"></div></div>
        <div class="group"><label>2. Nieszczelne podłączenie rury spaliny:</label><input type="text" id="u2" placeholder="np. 2 PGW" onclick="pokazPopup(2, 'urzadzenia')" oninput="zapiszStan()"><div id="popup_u2" class="skroty-popup"></div></div>
        
        <!-- Rubryki 3, 4, 6, 7 (Wentylacje) -->
        <div class="group"><label>3. Demontaż siatek / żaluzji z kratek:</label><input type="text" id="u3" placeholder="np. 1 WŁ / 8 WK" onclick="pokazPopup(3, 'wentylacja')" oninput="zapiszStan()"><div id="popup_u3" class="skroty-popup"></div></div>
        <div class="group"><label>4. Wymiana kratek na nowe 14x21 cm:</label><input type="text" id="u4" placeholder="np. 3 WK" onclick="pokazPopup(4, 'wentylacja')" oninput="zapiszStan()"><div id="popup_u4" class="skroty-popup"></div></div>
        
        <!-- Rubryka 5 (Pomieszczenia) -->
        <div class="group"><label>5. Za mała powierzchnia dopływu powietrza w drzwiach:</label><input type="text" id="u5" placeholder="np. 7 K" onclick="pokazPopup(5, 'pomieszczenia')" oninput="zapiszStan()"><div id="popup_u5" class="skroty-popup"></div></div>
        
        <!-- Rubryka 6 i 7 (Wentylacje) -->
        <div class="group"><label>6. Niedozwolony wyciąg mechaniczny:</label><input type="text" id="u6" placeholder="np. 10 WŁ" onclick="pokazPopup(6, 'wentylacja')" oninput="zapiszStan()"><div id="popup_u6" class="skroty-popup"></div></div>
        <div class="group"><label>7. Brak drożności / zasłonięcie kratki:</label><input type="text" id="u7" placeholder="np. 11 WKOT" onclick="pokazPopup(7, 'wentylacja')" oninput="zapiszStan()"><div id="popup_u7" class="skroty-popup"></div></div>
        
        <!-- Rubryka 8 (Urządzenia) -->
        <div class="group"><label>8. Zabudowana rura łącząca piec/kocioł:</label><input type="text" id="u8" placeholder="np. 14 KCO" onclick="pokazPopup(8, 'urzadzenia')" oninput="zapiszStan()"><div id="popup_u8" class="skroty-popup"></div></div>
        
        <!-- Rubryki 9, 10, 11 (Pomieszczenia) -->
        <div class="group"><label>9. Nieprawidłowa instalacja z rur PCV:</label><input type="text" id="u9" placeholder="np. 15 Ł" onclick="pokazPopup(9, 'pomieszczenia')" oninput="zapiszStan()"><div id="popup_u9" class="skroty-popup"></div></div>
        <div class="group"><label>10. Wentylacja jako otwór w ścianie zewnętrznej:</label><input type="text" id="u10" placeholder="np. 16 T" onclick="pokazPopup(10, 'pomieszczenia')" oninput="zapiszStan()"><div id="popup_u10" class="skroty-popup"></div></div>
        <div class="group"><label>11. Całkowity brak wentylacji:</label><input type="text" id="u11" placeholder="np. 18 KOT" onclick="pokazPopup(11, 'pomieszczenia')" oninput="zapiszStan()"><div id="popup_u11" class="skroty-popup"></div></div>
        
        <!-- Rubryka 12 (Urządzenia) -->
        <div class="group"><label>12. Niedozwolona zabudowa meblowa gazu:</label><input type="text" id="u12" placeholder="np. 19 PGW" onclick="pokazPopup(12, 'urzadzenia')" oninput="zapiszStan()"><div id="popup_u12" class="skroty-popup"></div></div>
        
        <!-- Rubryka 13 (Urządzenia) -->
        <div class="group"><label>13. Palny osad smolny w przewodzie dymowym:</label><input type="text" id="u13" placeholder="np. 20 KCO" onclick="pokazPopup(13, 'urzadzenia')" oninput="zapiszStan()"><div id="popup_u13" class="skroty-popup"></div></div>
        
        <!-- Rubryka 14 (Tylko numery) -->
        <div class="group"><label>14. Brak/niewystarczająca ilość powietrza nawiewnego:</label><input type="text" id="u14" placeholder="np. 4, 12, 15" oninput="zapiszStan()"></div>

        <!-- Rubryka 15 -->
        <div class="group">
            <label>15. Przewody dymowe wyeksploatowane. Zamontować wkłady kominowe lub wykonać renowację poprzez szlamowanie. Montując wkład kominowy dostosować przekrój przewodu do urządzenia grzewczego:</label>
            <select id="u15_wybor" onchange="zmienPrzewodyDymowe(); zapiszStan();">
                <option value="nie">Nie</option>
                <option value="tak">Tak</option>
            </select>
            <input type="text" id="u15_mieszkania" placeholder="Wpisz numer mieszkania..." style="margin-top: 6px; display: none;" oninput="zapiszStan()">
        </div>

        <button onclick="generujWszystko()">GENERUJ CAŁY DOKUMENT</button>
        <button type="button" onclick="rozpocznijNowyProtokol()" class="btn-warning">Rozpocznij nowy protokół (Wyczyść dane)</button>

        <div id="wynik_sekcja" style="display:none;">
            <h3>Podgląd całego dokumentu:</h3>
            <div class="output-box">
                <div id="out_calosc" class="output-text"></div>
                <button class="btn-copy" onclick="kopiujCaloscTekst()">Kopiuj cały tekst dokumentu</button>
            </div>
        </div>
    </div>

    <!-- ZAKŁADKA 1: LOKALE, URZĄDZENIA I PODPISY -->
    <div id="tab_1" class="tab-content">
        <h2>Kontrola lokali, urządzenia i podpisy</h2>
        <p style="font-size: 12px; color: #666;">Wszystko zapisuje się w historii automatycznie.</p>
        
        <!-- Nieudostępnione lokale -->
        <div class="group">
            <label>Nieudostępnione lokale do kontroli:</label>
            <input type="text" id="lokale_brak" placeholder="Kliknij, aby wpisać numer mieszkania..." readonly onclick="promptLokaleBrak()" style="cursor: pointer; background: #fff;" oninput="zapiszStan()">
        </div>

        <div id="kontener_lokali"></div>
        <button type="button" onclick="dodajLokal(); zapiszStan();" style="background: #17a2b8; margin-top: 5px;">+ Dodaj kolejny lokal / mieszkanie</button>
    </div>
</div>

<script>
    let licznikLokali = 0;
    let zatwierdzoneStan = {};
    let aktualneIdHistorii = null;
    const KLUCZ_ROBOCZY = 'protokol_ceeb_aktualnie_pisany';

    const slownikUrządzeń = {
        "PGW": "podgrzewacz gazowy wody",
        "KCOgaz": "kocioł CO gaz",
        "PK": "piec kaflowy",
        "KCO": "kocioł CO na opał stały",
        "K": "kominek"
    };

    const slownikWentylacji = {
        "WŁ": "wentylacja łazienki",
        "WK": "wentylacja kuchni",
        "WKOT": "wentylacja kotłowni",
        "WT": "wentylacja toalety"
    };

    const slownikPomieszczeń = {
        "K": "Kuchnia",
        "Ł": "łazienka",
        "T": "toaleta",
        "KOT": "kotłownia"
    };

    window.onload = function() {
        odswiezListeHistorii();
        inicjalizujPopupy();
        
        let zapisRoboczy = localStorage.getItem(KLUCZ_ROBOCZY);
        let wczytano = false;

        if (zapisRoboczy) {
            try {
                let stan = JSON.parse(zapisRoboczy);
                if (stan && stan.ogólne) {
                    aktualneIdHistorii = stan.id_historii || ('protokolec_' + Date.now());
                    wczytajStanObiekt(stan);
                    wczytano = true;
                }
            } catch (e) {}
        }

        if (!wczytano) {
            aktualneIdHistorii = 'protokolec_' + Date.now();
            document.getElementById('data_czas').value = ustawAktualnaDateCzas();
            dodajLokal();
            zapiszStan();
        } else {
            let poleDaty = document.getElementById('data_czas');
            if (!poleDaty.value.trim()) {
                poleDaty.value = ustawAktualnaDateCzas();
                zapiszStan();
            }
        }

        zmienDostepKontroli();
        zmienPrzewodyDymowe();
        przeliczSumePrzewodow();
        inicjalizujGestPrzelaczania();

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.group')) {
                zamknijWszystkiePopupy();
            }
        });
    };

    function promptLokaleBrak() {
        let inputEl = document.getElementById('lokale_brak');
        let obecnyTekst = inputEl.value.trim();
        let wpis = prompt("Wpisz numer nieudostępnionego lokalu:");
        
        if(wpis !== null && wpis.trim() !== "") {
            let czystyWpis = wpis.trim();
            if(obecnyTekst !== "") {
                inputEl.value = obecnyTekst + ", " + czystyWpis;
            } else {
                inputEl.value = czystyWpis;
            }
            zapiszStan();
        }
    }

    function zmienDostepKontroli() {
        let val = document.getElementById('dostep_wybor').value;
        let opcje = document.getElementById('dostep_opcje_nie');
        if(val === 'nie') {
            opcje.style.display = 'block';
        } else {
            opcje.style.display = 'none';
        }
    }

    function zmienPrzewodyDymowe() {
        let val = document.getElementById('u15_wybor').value;
        let inputMieszkania = document.getElementById('u15_mieszkania');
        if(val === 'tak') {
            inputMieszkania.style.display = 'block';
        } else {
            inputMieszkania.style.display = 'none';
            inputMieszkania.value = '';
        }
    }

    function inicjalizujPopupy() {
        let listy = {
            'urzadzenia': [
                {skrót: "PGW", nazwa: "Podgrzewacz gazowy wody"},
                {skrót: "KCOgaz", nazwa: "Kocioł CO gaz"},
                {skrót: "PK", nazwa: "Piec kaflowy"},
                {skrót: "KCO", nazwa: "Kocioł CO na opał stały"},
                {skrót: "K", nazwa: "Kominek"}
            ],
            'wentylacja': [
                {skrót: "WŁ", nazwa: "Wentylacja łazienki"},
                {skrót: "WK", nazwa: "Wentylacja kuchni"},
                {skrót: "WKOT", nazwa: "Wentylacja kotłowni"},
                {skrót: "WT", nazwa: "Wentylacja toalety"}
            ],
            'pomieszczenia': [
                {skrót: "K", nazwa: "Kuchnia"},
                {skrót: "Ł", nazwa: "Łazienka"},
                {skrót: "T", nazwa: "Toaleta"},
                {skrót: "KOT", nazwa: "Kotłownia"}
            ]
        };

        let typyRubryk = {
            1: 'urzadzenia', 2: 'urzadzenia',
            3: 'wentylacja', 4: 'wentylacja',
            5: 'pomieszczenia',
            6: 'wentylacja', 7: 'wentylacja',
            8: 'urzadzenia',
            9: 'pomieszczenia', 10: 'pomieszczenia', 11: 'pomieszczenia',
            12: 'urzadzenia', 13: 'urzadzenia'
        };

        for (let i = 1; i <= 13; i++) {
            let popup = document.getElementById('popup_u' + i);
            if(popup && typyRubryk[i]) {
                let typ = typyRubryk[i];
                let html = '';
                listy[typ].forEach(s => {
                    html += `<button type="button" onclick="wstawSkrót(${i}, '${s.skrót}')">${s.skrót}</button>`;

    function wstawSkrót(numer, skrot) {
        let input = document.getElementById('u' + numer);
        if(!input) return;
        let obecnyTekst = input.value.trim();
        let wpis = prompt("Wpisz numer mieszkania dla [" + skrot + "]:");
        if(wpis !== null && wpis.trim() !== "") {
            let nowyWpis = wpis.trim() + " " + skrot;
            if(obecnyTekst !== "") {
                input.value = obecnyTekst + " / " + nowyWpis;
            } else {
                input.value = nowyWpis;
            }
            zapiszStan();
        }
        zamknijWszystkiePopupy();

    function rozwinięteSkrótyWTekście(tekst) {
        if(!tekst) return '';
        let wynik = tekst;
        let pelnySlownik = {...slownikUrządzeń, ...slownikWentylacji, ...slownikPomieszczeń};
        for (let skrot in pelnySlownik) {
            let regex = new RegExp('\\b' + skrot + '\\b', 'g');
            wynik = wynik.replace(regex, pelnySlownik[skrot]);
        }
        return wynik;
    }

            if (key && key.startsWith('protokolec_') && key !== KLUCZ_ROBOCZY) {

        return lista.sort().reverse();

        let godziny = String(teraz.getHours()).padStart(2, '0');

        return `${dzien}.${miesiac}.${rok} r., godz. ${godzini}:${minuty}`;

    function inicjalizujCanvas(id, savedData = null, isLocked = false) {
        let canvas = document.getElementById('canvas_' + id);
        if(!canvas) return;
        let ctx = canvas.getContext('2d');
        let isDrawing = false;
        zatwierdzoneStan[id] = false;

        canvas.width = canvas.offsetWidth || 300;
        canvas.height = 150;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';

        if (savedData) {
            let img = new Image();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };
            img.src = savedData;
        }

        if (isLocked) {
            zatwierdzoneStan[id] = true;
            canvas.classList.add('locked-canvas');
            let btn = document.getElementById('btn_zatwierdz_' + id);
            if (btn) {
                btn.innerText = "Odblokuj podpis (Edytuj)";
                btn.style.background = "#d97706";
            }
        }

        function getPos(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            let clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.onmousedown = (e) => { if(zatwierdzoneStan[id]) return; isDrawing = true; let pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); };
        canvas.onmousemove = (e) => { if (!isDrawing || zatwierdzoneStan[id]) return; let pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
        canvas.onmouseup = () => { if(isDrawing) { isDrawing = false; zapiszStan(); } };
        canvas.onmouseleave = () => { if(isDrawing) { isDrawing = false; zapiszStan(); } };

        canvas.ontouchstart = (e) => { if(zatwierdzoneStan[id]) return; isDrawing = true; let pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); e.preventDefault(); };
        canvas.ontouchmove = (e) => { if (!isDrawing || zatwierdzoneStan[id]) return; let pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); e.preventDefault(); };
        canvas.ontouchend = () => { if(isDrawing) { isDrawing = false; zapiszStan(); } };
    }

    function wyczyscPodpis(id) {
        if(zatwierdzoneStan[id]) {
            alert("Podpis jest zatwierdzony i zablokowany. Kliknij najpierw 'Odblokuj podpis'.");
            return;
        }
        let canvas = document.getElementById('canvas_' + id);
        if(!canvas) return;
        let ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        zapiszStan();
    }

    function zatwierdzPodpis(id) {
        let btn = document.getElementById('btn_zatwierdz_' + id);
        let canvas = document.getElementById('canvas_' + id);
        if(!canvas || !btn) return;
        
        if(!zatwierdzoneStan[id]) {

            canvas.classList.add('locked-canvas');
            btn.innerText = "Odblokuj podpis (Edytuj)";
            btn.style.background = "#d97706";

            zatwierdzoneStan[id] = false;
            canvas.classList.remove('locked-canvas');

                chk_brak_stopni: document.getElementById('chk_brak_stopni').checked,
                lokale_brak: document.getElementById('lokale_brak').value,
                s_dach_sel: document.getElementById('s_dach_sel').value,
                s_dach_opis: document.getElementById('s_dach_opis').value,
                s_strych_sel: document.getElementById('s_strych_sel').value,
                s_strych_opis: document.getElementById('s_strych_opis').value,
                drzwiczki_stan: document.getElementById('drzwiczki_stan').value,
                drzwiczki_gdzie: document.getElementById('drzwiczki_gdzie').value,
                nasady: document.getElementById('nasady').value,
                uwagi_własne: document.getElementById('uwagi_własne').value,
                u15_wybor: document.getElementById('u15_wybor').value,
                u15_mieszkania: document.getElementById('u15_mieszkania').value
            },
            nieprawidłowości: {},
            lokale: []
        };

        for (let i = 1; i <= 14; i++) {
            let el = document.getElementById('u' + i);
            if (el) stan.nieprawidłowości['u' + i] = el.value;
        }

        let karty = document.querySelectorAll('.lokal-card');
        karty.forEach(k => {
            let id = k.id.split('_')[2];
            let canvas = document.getElementById('canvas_' + id);
            stan.lokale.push({
                nr: document.getElementById('l_nr_' + id).value,
                urz: document.getElementById('l_urz_' + id).value,
                wentylator: document.getElementById('l_wentylator_' + id) ? document.getElementById('l_wentylator_' + id).value : '',
                funkcja: document.getElementById('l_funkcja_' + id) ? document.getElementById('l_funkcja_' + id).value : '',
                wen: document.getElementById('l_wen_' + id).value,
                dym: document.getElementById('l_dym_' + id).value,
                spa: document.getElementById('l_spa_' + id).value,
                canvasData: canvas ? canvas.toDataURL('image/png') : null,
                zatwierdzony: zatwierdzoneStan[id] || false
            });
        });

        return stan;
    }

    function zapiszStan() {
        let stan = zbierzCalowityStan();
        localStorage.setItem(KLUCZ_ROBOCZY, JSON.stringify(stan));
        if (aktualneIdHistorii) {
            localStorage.setItem(aktualneIdHistorii, JSON.stringify(stan));
        }
        odswiezListeHistorii();
    }

    function wczytajStanObiekt(stan) {
        if(stan.ogólne) {
            for (let key in stan.ogólne) {
                let el = document.getElementById(key);
                if (el) {
                    if (el.type === 'checkbox') {
                        el.checked = stan.ogólne[key];
                    } else {
                        el.value = stan.ogólne[key];
                    }
                }
            }
        }
        if(stan.nieprawidłowości) {
            for (let key in stan.nieprawidłowości) {
                let el = document.getElementById(key);
                if (el) el.value = stan.nieprawidłowości[key];
            }
        }

        zmienDostepKontroli();
        zmienPrzewodyDymowe();

        document.getElementById('kontener_lokali').innerHTML = '';
        licznikLokali = 0;
        zatwierdzoneStan = {};

        if (stan.lokale && stan.lokale.length > 0) {
            stan.lokale.forEach(l => { dodajLokal(l); });
        } else {
            dodajLokal();
        }
        przeliczSumePrzewodow();
    }

    function wczytajPlikJSON(event) {
        let file = event.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let stan = JSON.parse(e.target.result);
                aktualneIdHistorii = 'protokolec_' + Date.now();
                wczytajStanObiekt(stan);
                zapiszStan();
                alert("Protokół został pomyślnie zaimportowany i dodany do historii edycji!");
            } catch (err) {
                alert("Błąd odczytu pliku JSON.");
            }
        };
        reader.readAsText(file);
    }

    function pobierzPlikJSONAutomatycznie() {
        let stan = zbierzCalowityStan();
        let tekst = JSON.stringify(stan, null, 2);
        let adres = document.getElementById('adres_budynku').value.trim() || 'Protokol_CEEB';
        let bezpiecznaNazwa = adres.replace(/[^a-zA-Z0-9żźćąęłóśźŻŹĆĄĘŁÓŚŚ -]/g, '_') + '_ZESTAW_EDYCJA.json';
        
        let blob = new Blob([tekst], { type: "application/json;charset=utf-8" });
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = bezpiecznaNazwa;
        link.click();
    }

    function rozpocznijNowyProtokol(pytaj = true) {
        if (!pytaj || confirm("Czy na pewno chcesz rozpocząć nowy protokół i wyczyścić formularz?")) {
            aktualneIdHistorii = 'protokolec_' + Date.now();
            
            localStorage.removeItem(KLUCZ_ROBOCZY);
            
            document.getElementById('kontener_lokali').innerHTML = '';
            licznikLokali = 0;
            zatwierdzoneStan = {};
            
            document.querySelectorAll('input[type="text"], textarea, input[type="number"]').forEach(el => {
                if(!el.readOnly && el.id !== 'lista_historii_select') {
                    el.value = '';
                }
            });

            document.querySelectorAll('input[type="checkbox"]').forEach(el => {
                el.checked = false;
            });

            document.getElementById('dostep_wybor').value = 'tak';
            document.getElementById('u15_wybor').value = 'nie';
            zmienDostepKontroli();
            zmienPrzewodyDymowe();
            
            document.getElementById('p_dym').value = '0';
            document.getElementById('p_spa').value = '0';
            document.getElementById('p_wen').value = '0';
            document.getElementById('p_awa').value = '0';
            document.getElementById('p_raz').value = '0';
            document.getElementById('wynik_sekcja').style.display = 'none';

            // Automatyczne wstawienie bieżącej daty i godziny przy nowym protokole
            document.getElementById('data_czas').value = ustawAktualnaDateCzas();

            dodajLokal();
            zapiszStan();
            odswiezListeHistorii();
            zmienZakladke(0);
        }
    }

    function generujWszystko() {
        zapiszStan();
        let adres = document.getElementById('adres_budynku').value.trim() || 'Budynek_bez_adresu';
        let dc = document.getElementById('data_czas').value;
        let pd = document.getElementById('p_dym').value;
        let ps = document.getElementById('p_spa').value;
        let pw = document.getElementById('p_wen').value;
        let pa = document.getElementById('p_awa').value;
        let pr = document.getElementById('p_raz').value;
        
        let dostepVal = document.getElementById('dostep_wybor').value;
        let dostepTekst = dostepVal;
        if(dostepVal === 'nie') {
            let braki = [];
            if(document.getElementById('chk_brak_wykazu').checked) braki.push("brak wykazu dachowego");
            if(document.getElementById('chk_brak_law').checked) braki.push("brak ław kominiarskich");
            if(document.getElementById('chk_brak_drabiny').checked) braki.push("brak drabiny");
            if(document.getElementById('chk_brak_stopni').checked) braki.push("brak stopni kominiarskich");
            if(braki.length > 0) {
                dostepTekst += " (brak: " + braki.join(", ") + ")";
            }
        }

        let lb = document.getElementById('lokale_brak').value;
        let sd = document.getElementById('s_dach_opis').value;
        let ss = document.getElementById('s_strych_opis').value;
        let dzs = document.getElementById('drzwiczki_stan').value;
        let dzg = document.getElementById('drzwiczki_gdzie').value;
        let nas = document.getElementById('nasady').value;
        let uwagiWłasne = document.getElementById('uwagi_własne').value.trim();

        let calyTekst = `=== PROTOKÓŁ / KONTROLA KOMINIARSKA ===\n` +
                        `Adres budynku: ${adres}\n` +
                        `Data i godzina kontroli: ${dc}\n\n` +
                        `--- INFORMACJE OGÓLNE O BUDYNKU ---\n` +
                        `Ilość przewodów - dymowe: ${pd}, spalinowe: ${ps}, wentylacyjne: ${pw}, awaryjne: ${pa}, razem: ${pr}.\n` +
                        `Dostęp do kontroli: ${dostepTekst}. ` + (lb ? `Nieudostępnione lokale do kontroli nr: ${lb}. ` : '') + `\n` +
                        `Stan kominów ponad dachem: ${sd}.\n` +
                        `Stan kominów na strychu: ${ss}.\n` +
                        `Stan drzwiczek kominowych: ${dzs}${dzg ? ' (' + dzg + ')' : ''}.\n` +
                        (nas ? `Nasady kominowe: ${nas}\n` : '');

        if (uwagiWłasne) {
            calyTekst += `\n--- DODATKOWE UWAGI ---\n${uwagiWłasne}\n`;
        }

        calyTekst += `\n--- ZESTAWIENIE KONTROLI LOKALI ---\n`;
        let karty = document.querySelectorAll('.lokal-card');
        karty.forEach((karta) => {
            let id = karta.id.split('_')[2];
            let nr = document.getElementById('l_nr_' + id).value || 'Brak numeru';
            let urz = document.getElementById('l_urz_' + id).value || 'Brak wybranego urządzenia';
            let w = document.getElementById('l_wen_' + id).value || '0';
            let d = document.getElementById('l_dym_' + id).value || '0';
            let s = document.getElementById('l_spa_' + id).value || '0';

            let szczegolyUrz = urz;
            if(urz === "Kocioł CO na opał stały") {
                let went = document.getElementById('l_wentylator_' + id).value;
                let funkcja = document.getElementById('l_funkcja_' + id).value;
                szczegolyUrz += ` (${went}, funkcja: ${funkcja})`;
            } else if(urz === "Kominek" || urz === "Trzon kuchenny" || urz === "Kocioł gazowy" || urz === "Pompa ciepła" || urz === "Ogrzewanie elektryczne") {
                let funkcja = document.getElementById('l_funkcja_' + id).value;
                szczegolyUrz += ` (funkcja: ${funkcja})`;
            }

            calyTekst += `• Lokal nr ${nr}\n  - Urządzenie grzewcze: ${szczegolyUrz}\n  - Podłączenia: Wentylacyjne: ${w}, Dymowe: ${d}, Spalinowe: ${s}\n\n`;
        });

        calyTekst += `--- STWIERDZONE NIEPRAWIDŁOWOŚCI I NAKAZY ---\n`;
        let items = [];
        for (let i = 1; i <= 14; i++) {
            let surowyTekst = document.getElementById('u' + i).value.trim();
            let val = rozwinięteSkrótyWTekście(surowyTekst);
            if (val) {
                let opisy = [
                    "", "1. Wymiana przewodu łączącego z certyfikatem CE. Mieszkania nr: ",
                    "2. Nieszczelne podłączenie rury odprowadzającej spaliny. Mieszkania nr: ",
                    "3. Demontaż siatek / żaluzji z kratek wentylacyjnych. Mieszkania nr: ",
                    "4. Wymiana kratek wentylacyjnych na nowe 14x21 cm. Lokale nr: ",
                    "5. Za mała powierzchnia dopływu powietrza w drzwiach (min. 220 cm²). Mieszkania nr: ",
                    "6. Niedozwolone podłączenie mechanicznego wyciągu do wentylacji. Mieszkania nr: ",
                    "7. Brak drożności / zasłonięcie kratki wentylacyjnej. Lokale nr: ",
                    "8. Zabudowana rura łącząca piec/kocioł z kominem. Mieszkania nr: ",
                    "9. Nieprawidłowa instalacja z rur PCV (wymiana ponad dach). Lokale: ",
                    "10. Wentylacja jako otwór w ścianie zewnętrznej (wymiana na pion). Lokale: ",
                    "11. Całkowity brak wentylacji w pomieszczeniu. Nakaz dotyczy lokali: ",
                    "12. Niedozwolona stała zabudowa meblowa gazu. Mieszkania nr: ",
                    "13. Obecność palnego osadu smolnego w przewodzie dymowym. Mieszkania nr: ",
                    "14. Brak lub niewystarczająca ilość powietrza nawiewnego. Mieszkania nr: "
                ];
                items.push(opisy[i] + val + ".");
            }
        }

        let u15_wybor = document.getElementById('u15_wybor').value;
        if(u15_wybor === 'tak') {
            let u15_mieszkania = document.getElementById('u15_mieszkania').value.trim();
            let wpis15 = "15. Przewody dymowe wyeksploatowane. Zamontować wkłady kominowe lub wykonać renowację poprzez szlamowanie. Montując wkład kominowy dostosować przekrój przewodu do urządzenia grzewczego";
            if(u15_mieszkania) {
                wpis15 += ". Mieszkania nr: " + u15_mieszkania;
            }
            items.push(wpis15 + ".");
        }

        if(items.length > 0) {
            calyTekst += items.join("\n") + "\n\n";
            calyTekst += "Administrator (zarządca)/właściciel obiektu budowlanego przyjął do wiadomości zakres stosowania art.70 Ustawy Prawo Budowlane o obowiązkowym usunięciu usterek.";
        } else {
            calyTekst += "Nie stwierdzono nieprawidłowości.";
        }

        document.getElementById('out_calosc').innerText = calyTekst;

        let htmlPodpisow = `<h4 style="color: #0d3880; margin-bottom: 5px;">ZBIORCZE PODPISY LOKATORÓW:</h4>`;
        karty.forEach((karta) => {
            let id = karta.id.split('_')[2];
            let nr = document.getElementById('l_nr_' + id).value || 'Brak numeru';
            let canvas = document.getElementById('canvas_' + id);
            
            htmlPodpisow += `<div class="podpis-podsumowanie-item"><strong>Lokal nr ${nr}:</strong><br><img src="${canvas.toDataURL('image/png')}"></div>`;
        });

        document.getElementById('wynik_sekcja').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

        pobierzPlikTxtAutomatycznie(calyTekst, adres);
        pobierzPelnyDokumentHTMLAutomatycznie(calyTekst, htmlPodpisow, adres);
        pobierzPlikJSONAutomatycznie();
    }

    function pobierzPlikTxtAutomatycznie(tekst, adres) {
        let bezpiecznaNazwa = adres.replace(/[^a-zA-Z0-9żźćąęłóśźŻŹĆĄĘŁÓŚŚ -]/g, '_') + '.txt';
        let blob = new Blob([tekst], { type: "text/plain;charset=utf-8" });
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = bezpiecznaNazwa;
        link.click();
    }

    function pobierzPelnyDokumentHTMLAutomatycznie(tekstDokumentu, htmlPodpisow, adres) {
        let bezpiecznaNazwa = adres.replace(/[^a-zA-Z0-9żźćąęłóśźŻŹĆĄĘŁÓŚŚ -]/g, '_') + '_KOMPLETNY_Z_PODPISAMI.html';
        
        let htmlZawartosc = `<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Protokół CEEB - ${adres}</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; color: #333; line-height: 1.5; }
h2 { color: #0d3880; border-bottom: 2px solid #0d3880; padding-bottom: 5px; }
pre { white-space: pre-wrap; font-family: Arial, sans-serif; font-size: 14px; background: #f8fafc; padding: 15px; border: 1px solid #cbd5e1; border-radius: 5px; }
.podpis-podsumowanie-item { border-bottom: 1px dashed #ccc; padding: 8px 0; margin-bottom: 8px; }
.podpis-podsumowanie-item img { max-width: 200px; height: 60px; border: 1px solid #999; background: #fff; display: block; margin-top: 4px; }
</style>
</head>
<body>
<h2>Protokół Kontroli Kominiarskiej CEEB</h2>
<pre>${tekstDokumentu}</pre>
<div>${htmlPodpisow}</div>
</body>
</html>`;

        let blob = new Blob([htmlZawartosc], { type: "text/html;charset=utf-8" });
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = bezpiecznaNazwa;
        link.click();
    }

    function kopiujCaloscTekst() {
        let tekst = document.getElementById('out_calosc').innerText;
        navigator.clipboard.writeText(tekst).then(() => alert("Skopiowano tekst dokumentu do schowka!"));
    }
</script>
</body>
</html>
